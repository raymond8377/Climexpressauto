<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ClimExpress — Agenda & Clients</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ice: #e8f4fd;
    --frost: #b8dff5;
    --blue: #1a6fa8;
    --deep: #0b2545;
    --dark: #1a3a6b;
    --accent: #00c2ff;
    --green: #00d68f;
    --orange: #ff9500;
    --red: #ff4444;
    --card: #22487a;
    --border: rgba(255,255,255,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #1a3a6b !important;
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: #1a3a6b;
    pointer-events: none; z-index: 0;
  }
  html { background: #1a3a6b !important; }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(22,50,96,0.99);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); letter-spacing: 2px; }
  .logo span { color: #fff; }
  .header-date { font-size: 11px; color: rgba(255,255,255,0.6); text-align: right; }

  /* NAV TABS */
  .nav { display: flex; background: #163260; border-bottom: 1px solid var(--border); position: sticky; top: 57px; z-index: 99; }
  .nav-btn {
    flex: 1; padding: 10px 4px; border: none; background: none; color: rgba(255,255,255,0.45);
    font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all .2s;
    border-bottom: 2px solid transparent;
  }
  .nav-btn .icon { font-size: 18px; }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* PAGES */
  .page { display: none; padding: 16px; position: relative; z-index: 1; animation: fadeIn .25s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: translateY(0); } }

  /* SECTION TITLE */
  .section-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #fff;
    letter-spacing: 2px; margin-bottom: 16px;
  }
  .section-title span { color: var(--accent); }

  /* CARDS */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    backdrop-filter: blur(8px);
  }

  /* STATS ROW */
  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card {
    background: #22487a; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 10px; text-align: center;
  }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 30px; color: var(--accent); line-height: 1; }
  .stat-label { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }

  /* TODAY TIMELINE */
  .today-section { margin-bottom: 20px; }
  .today-rdv {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 12px; background: #22487a;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; margin-bottom: 8px;
    position: relative; overflow: hidden;
  }
  .today-rdv::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  }
  .today-rdv.confirmed::before { background: var(--green); }
  .today-rdv.pending::before { background: var(--orange); }
  .today-rdv.done::before { background: rgba(205,232,255,0.2); }
  .rdv-time { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--accent); min-width: 52px; line-height: 1.1; }
  .rdv-info { flex: 1; }
  .rdv-name { font-weight: 700; font-size: 15px; color: #ffffff; }
  .rdv-detail { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }
  .rdv-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600;
    display: inline-block; margin-top: 4px;
  }
  .badge-vl { background: rgba(0,214,143,0.15); color: var(--green); }
  .badge-vu { background: rgba(255,149,0,0.15); color: var(--orange); }
  .badge-pl { background: rgba(0,194,255,0.15); color: var(--accent); }

  .rdv-actions { display: flex; gap: 6px; flex-direction: column; }
  .btn-icon {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(0,194,255,0.08); color: var(--accent); font-size: 15px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .btn-icon:active { background: rgba(0,194,255,0.2); }

  /* FREE SLOTS */
  .slots { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; background: transparent; }
  .slot {
    padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff;
    cursor: pointer; transition: all .15s;
  }
  .slot:active { background: rgba(0,194,255,0.25); transform: scale(.97); }
  .slot.taken { background: rgba(255,68,68,0.15); color: #ff8080; border-color: rgba(255,68,68,0.3); cursor: default; }
  .slot.free { background: rgba(0,214,143,0.15); color: #00d68f; border-color: rgba(0,214,143,0.3); }

  /* FORM */
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: #163260;
    color: #ffffff; font-family: 'DM Sans', sans-serif; font-size: 14px;
    outline: none; transition: border-color .2s;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  input::placeholder { color: rgba(255,255,255,0.35); }
  select option { background: #163260; color: #fff; }
  textarea { resize: none; height: 80px; }

  .btn {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all .2s; letter-spacing: .5px;
  }
  .btn-primary { background: var(--accent); color: var(--dark); }
  .btn-primary:active { background: #00a8e0; transform: scale(.99); }
  .btn-danger { background: rgba(255,68,68,0.15); color: var(--red); border: 1px solid rgba(255,68,68,0.3); margin-top: 8px; }
  .btn-secondary { background: rgba(0,194,255,0.1); color: var(--accent); border: 1px solid var(--border); }

  /* CLIENT LIST */
  .client-card {
    background: #22487a; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center;
  }
  .client-avatar {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: #fff; flex-shrink: 0;
  }
  .client-info { flex: 1; min-width: 0; }
  .client-name { font-weight: 700; font-size: 14px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .client-sub { font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 2px; }
  .client-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .tag { font-size: 10px; padding: 2px 7px; border-radius: 10px; background: rgba(0,194,255,0.1); color: var(--accent); border: 1px solid rgba(0,194,255,0.2); }

  .client-actions { display: flex; gap: 6px; }

  /* SEARCH */
  .search-box {
    position: relative; margin-bottom: 14px;
  }
  .search-box input { padding-left: 38px; }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: .5; }

  /* NOTIFICATION */
  .notif {
    position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--green); color: var(--dark); padding: 10px 20px; border-radius: 20px;
    font-weight: 700; font-size: 13px; z-index: 999; opacity: 0;
    transition: all .3s; pointer-events: none; white-space: nowrap;
  }
  .notif.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* RAPPEL SECTION */
  .rappel-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: #22487a;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; margin-bottom: 8px;
  }
  .rappel-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .rappel-dot.urgent { background: var(--red); }
  .rappel-dot.today { background: var(--orange); }
  .rappel-dot.future { background: var(--green); }
  .rappel-text { flex: 1; font-size: 13px; color: #cde8ff; }
  .rappel-time { font-size: 11px; color: rgba(205,232,255,0.4); }

  /* CALENDAR MINI */
  .calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff; letter-spacing: 1px; }
  .cal-arrow { background: none; border: 1px solid var(--border); color: var(--accent); width: 32px; height: 32px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
  .cal-day-header { text-align: center; font-size: 10px; color: rgba(205,232,255,0.4); font-weight: 600; text-transform: uppercase; padding: 4px 0; }
  .cal-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 8px; font-size: 13px; cursor: pointer; transition: all .15s;
    position: relative;
  }
  .cal-day.empty { cursor: default; }
  .cal-day.today-day { background: var(--accent); color: var(--dark); font-weight: 700; }
  .cal-day.has-rdv::after {
    content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--orange);
  }
  .cal-day.today-day::after { background: var(--dark); }
  .cal-day:not(.empty):not(.today-day):hover { background: rgba(0,194,255,0.12); }
  .cal-day.selected-day { background: rgba(0,194,255,0.2); color: var(--accent); font-weight: 700; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(8,26,40,0.92); z-index: 500;
    display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    width: 100%; background: #1a3a6b; border-radius: 20px 20px 0 0;
    border: 1px solid var(--border); padding: 20px;
    transform: translateY(100%); transition: transform .3s ease;
    max-height: 85vh; overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; background: rgba(205,232,255,0.2); border-radius: 2px; margin: 0 auto 16px; }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: #fff; margin-bottom: 16px; letter-spacing: 1px; }

  .empty-state { text-align: center; padding: 40px 20px; color: rgba(205,232,255,0.3); }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* PHONE LINK */
  a.tel { color: var(--accent); text-decoration: none; font-weight: 600; }

  .full-rdv-list { }
  .rdv-day-header { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; padding: 8px 0 6px; }
</style>
</head>
<body>

<div class="notif" id="notif">✓ Enregistré</div>

<header>
  <div>
    <div class="logo">Clim<span>Express</span></div>
    <div style="font-size:10px;color:rgba(205,232,255,0.4);letter-spacing:.5px;">AGENDA & CLIENTS</div>
  </div>
  <div class="header-date" id="headerDate"></div>
</header>

<nav class="nav">
  <button class="nav-btn active" onclick="goPage('accueil',this)"><span class="icon">🏠</span>Accueil</button>
  <button class="nav-btn" onclick="goPage('rdv',this)"><span class="icon">📅</span>RDV</button>
  <button class="nav-btn" onclick="goPage('clients',this)"><span class="icon">👥</span>Clients</button>
  <button class="nav-btn" onclick="goPage('agenda',this)"><span class="icon">🗓</span>Agenda</button>
  <button class="nav-btn" onclick="goPage('rappels',this)"><span class="icon">🔔</span><span id="notifBadge">Rappels</span></button>
</nav>

<!-- PAGE ACCUEIL -->
<div class="page active" id="page-accueil">
  <div class="section-title">Aujourd'hui <span id="todayDateTitle"></span></div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-num" id="statToday">0</div>
      <div class="stat-label">RDV Aujourd'hui</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statWeek">0</div>
      <div class="stat-label">Cette Semaine</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statClients">0</div>
      <div class="stat-label">Clients Total</div>
    </div>
  </div>

  <div class="today-section">
    <div style="font-size:13px;font-weight:600;color:rgba(205,232,255,0.6);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Planning du jour</div>
    <div id="todayList"></div>
  </div>

  <div style="font-size:13px;font-weight:600;color:rgba(205,232,255,0.6);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Créneaux libres aujourd'hui</div>
  <div class="slots" id="todaySlots"></div>

  <button class="btn btn-primary" onclick="goPage('rdv',document.querySelectorAll('.nav-btn')[1])" style="margin-top:8px;">＋ Nouveau RDV</button>
</div>

<!-- PAGE RDV -->
<div class="page" id="page-rdv">
  <div class="section-title">Nouveau <span>RDV</span></div>
  <div class="card">
    <div class="form-group">
      <label>Nom du client</label>
      <input type="text" id="rdvNom" placeholder="Ex: Jean Dupont">
    </div>
    <div class="form-group">
      <label>Téléphone</label>
      <input type="tel" id="rdvTel" placeholder="06 12 34 56 78">
    </div>
    <div class="form-group">
      <label>Adresse / Lieu d'intervention</label>
      <input type="text" id="rdvAdresse" placeholder="Ex: 15 rue des Mimosas, Toulon">
    </div>
    <div class="form-group">
      <label>Type de recharge</label>
      <select id="rdvType">
        <option value="">— Choisir —</option>
        <option value="VL Recharge Standard (R134a)">VL — Recharge Standard (R134a)</option>
        <option value="VL Recharge Standard (R1234yf)">VL — Recharge Standard (R1234yf)</option>
        <option value="VL Recharge + Désinfection">VL — Recharge + Désinfection</option>
        <option value="VU Recharge Standard">VU — Recharge Standard</option>
        <option value="VU Recharge + Désinfection">VU — Recharge + Désinfection</option>
        <option value="PL Recharge Standard">PL — Recharge Standard</option>
        <option value="Diagnostic + Recharge">Diagnostic + Recharge</option>
        <option value="Contrôle étanchéité">Contrôle Étanchéité</option>
      </select>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="rdvDate">
    </div>
    <div class="form-group">
      <label>Heure</label>
      <select id="rdvHeure">
        <option value="">— Choisir un créneau —</option>
      </select>
    </div>
    <div class="form-group">
      <label>Notes (optionnel)</label>
      <textarea id="rdvNotes" placeholder="Modèle voiture, problème particulier..."></textarea>
    </div>
    <button class="btn btn-primary" onclick="saveRDV()">✓ Enregistrer le RDV</button>
  </div>
</div>

<!-- PAGE CLIENTS -->
<div class="page" id="page-clients">
  <div class="section-title">Annuaire <span>Clients</span></div>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchClient" placeholder="Rechercher un client..." oninput="renderClients()">
  </div>
  <div id="clientList"></div>
</div>

<!-- PAGE AGENDA -->
<div class="page" id="page-agenda">
  <div class="section-title">Agenda <span>Mensuel</span></div>
  <div class="card">
    <div class="calendar-nav">
      <button class="cal-arrow" onclick="changeMonth(-1)">‹</button>
      <div class="cal-title" id="calMonthTitle"></div>
      <button class="cal-arrow" onclick="changeMonth(1)">›</button>
    </div>
    <div class="calendar-grid" id="calGrid"></div>
  </div>
  <div id="dayRDVList" style="margin-top:8px;"></div>

  <div style="margin-top:20px;">
    <div class="section-title" style="font-size:20px;">Tous les <span>RDV</span></div>
    <div id="fullRDVList"></div>
  </div>
</div>

<!-- PAGE RAPPELS -->
<div class="page" id="page-rappels">
  <div class="section-title">🔔 <span>Rappels</span></div>
  <div id="rappelList"></div>
</div>

<!-- MODAL CLIENT DETAIL -->
<div class="modal-overlay" id="clientModal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalClientName">Client</div>
    <div id="modalClientContent"></div>
  </div>
</div>

<!-- MODAL RDV DETAIL -->
<div class="modal-overlay" id="rdvModal" onclick="closeRdvModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">📅 Détail RDV</div>
    <div id="modalRdvContent"></div>
  </div>
</div>

<script>
// =========== SUPABASE ===========
const SB_URL = 'https://cytgdpeoxhxempnewrep.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN5dGdkcGVveGh4ZW1wbmV3cmVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4Njk1NzUsImV4cCI6MjA5NjQ0NTU3NX0.Xnx99U2TgdeO2msP7PbkKFTDy1zpFqrMPNIRCr6uxQk';
const SB_HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };

async function syncFromSupabase() {
  try {
    const res = await fetch(`${SB_URL}/rest/v1/rdvs?select=*&order=date.asc,heure.asc`, { headers: SB_HEADERS });
    if (!res.ok) return;
    const data = await res.json();
    if (!Array.isArray(data)) return;
    // Fusionner les RDV web avec les RDV locaux (éviter doublons par id_supabase)
    const webRdvs = data.map(r => ({
      id: r.id || ('web_' + r.created_at),
      nom: r.nom, tel: r.tel, adresse: r.adresse, type: r.type,
      date: r.date, heure: r.heure, notes: r.notes || '',
      status: r.status || 'confirmed', source: 'web',
      supabase_id: r.id, createdAt: r.created_at
    }));
    // Garder les RDV locaux qui ne viennent pas du web
    const localOnly = rdvs.filter(r => r.source !== 'web');
    // Fusionner
    const merged = [...localOnly, ...webRdvs];
    rdvs = merged;
    localStorage.setItem('clim_rdvs', JSON.stringify(rdvs));
    // Auto-ajouter clients
    webRdvs.forEach(r => addClientIfNew(r.nom, r.tel, r.adresse, r.type));
    renderAccueil(); renderCalendar(); renderRappels(); updateStats();
    showSyncBadge(webRdvs.length);
  } catch(e) { console.log('Sync offline'); }
}

function showSyncBadge(n) {
  const existing = document.getElementById('syncBadge');
  if (existing) existing.remove();
  if (n === 0) return;
  const badge = document.createElement('div');
  badge.id = 'syncBadge';
  badge.style.cssText = 'position:fixed;top:65px;right:12px;background:var(--green);color:var(--dark);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;z-index:200;';
  badge.textContent = '🔄 ' + n + ' RDV synchronisés';
  document.body.appendChild(badge);
  setTimeout(() => badge.remove(), 3000);
}

// Synchronisation automatique toutes les 30 secondes
setInterval(syncFromSupabase, 30000);

// =========== DATA ===========
let rdvs = JSON.parse(localStorage.getItem('clim_rdvs') || '[]');
let clients = JSON.parse(localStorage.getItem('clim_clients') || '[]');
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
let selectedCalDay = null;

const HEURES = ['08:00','08:30','09:00','09:30','10:00','10:30','11:00','11:30',
  '13:00','13:30','14:00','14:30','15:00','15:30','16:00','16:30','17:00','17:30'];

// =========== INIT ===========
function init() {
  const now = new Date();
  document.getElementById('headerDate').innerHTML = now.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}).toUpperCase() + '<br>' + now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('todayDateTitle').textContent = now.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});
  document.getElementById('rdvDate').valueAsDate = now;
  fillHeures();
  renderAccueil();
  renderClients();
  renderCalendar();
  renderRappels();
  updateStats();
}

function fillHeures(date) {
  const sel = document.getElementById('rdvHeure');
  const d = date || document.getElementById('rdvDate').value;
  const todayRDVs = rdvs.filter(r => r.date === d && r.status !== 'annule');
  const taken = todayRDVs.map(r => r.heure);
  sel.innerHTML = '<option value="">— Choisir un créneau —</option>';
  HEURES.forEach(h => {
    const opt = document.createElement('option');
    opt.value = h;
    opt.textContent = taken.includes(h) ? h + ' — Occupé ✗' : h + ' — Libre ✓';
    opt.disabled = taken.includes(h);
    sel.appendChild(opt);
  });
}
document.getElementById('rdvDate').addEventListener('change', e => fillHeures(e.target.value));

// =========== SAVE RDV ===========
function saveRDV() {
  const nom = document.getElementById('rdvNom').value.trim();
  const tel = document.getElementById('rdvTel').value.trim();
  const adresse = document.getElementById('rdvAdresse').value.trim();
  const type = document.getElementById('rdvType').value;
  const date = document.getElementById('rdvDate').value;
  const heure = document.getElementById('rdvHeure').value;
  const notes = document.getElementById('rdvNotes').value.trim();
  if (!nom || !tel || !date || !heure || !type) { showNotif('⚠️ Remplis les champs requis', '#ff9500'); return; }

  const rdv = { id: Date.now(), nom, tel, adresse, type, date, heure, notes, status: 'confirmed', createdAt: new Date().toISOString() };
  rdvs.push(rdv);
  localStorage.setItem('clim_rdvs', JSON.stringify(rdvs));

  // Auto-add client if new
  addClientIfNew(nom, tel, adresse, type);

  // Reset form
  document.getElementById('rdvNom').value = '';
  document.getElementById('rdvTel').value = '';
  document.getElementById('rdvAdresse').value = '';
  document.getElementById('rdvType').value = '';
  document.getElementById('rdvNotes').value = '';
  document.getElementById('rdvDate').valueAsDate = new Date();
  fillHeures();

  showNotif('✓ RDV enregistré !');
  renderAccueil(); renderCalendar(); renderRappels(); updateStats();
  goPage('accueil', document.querySelectorAll('.nav-btn')[0]);
}

function addClientIfNew(nom, tel, adresse, type) {
  let c = clients.find(c => c.tel === tel);
  if (!c) {
    c = { id: Date.now(), nom, tel, adresse, types: [type], rdvCount: 1, createdAt: new Date().toISOString() };
    clients.push(c);
  } else {
    c.rdvCount = (c.rdvCount || 0) + 1;
    if (!c.types.includes(type)) c.types.push(type);
    if (adresse && !c.adresse) c.adresse = adresse;
  }
  localStorage.setItem('clim_clients', JSON.stringify(clients));
  renderClients();
}

// =========== ACCUEIL ===========
function renderAccueil() {
  const today = new Date().toISOString().split('T')[0];
  const todayRDVs = rdvs.filter(r => r.date === today && r.status !== 'annule').sort((a,b) => a.heure.localeCompare(b.heure));

  const list = document.getElementById('todayList');
  if (todayRDVs.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">☀️</div><p>Aucun RDV aujourd\'hui</p></div>';
  } else {
    list.innerHTML = todayRDVs.map(r => rdvCard(r)).join('');
  }

  // Free slots
  const taken = todayRDVs.map(r => r.heure);
  const slotsDiv = document.getElementById('todaySlots');
  slotsDiv.innerHTML = HEURES.map(h => `<div class="slot ${taken.includes(h)?'taken':'free'}" onclick="${taken.includes(h)?'':'quickBook(\''+h+'\')'}">${h} ${taken.includes(h)?'✗':'✓'}</div>`).join('');
}

function quickBook(h) {
  document.getElementById('rdvHeure').value = h;
  goPage('rdv', document.querySelectorAll('.nav-btn')[1]);
}

function rdvCard(r) {
  const badge = r.type.startsWith('VL') ? 'badge-vl' : r.type.startsWith('VU') ? 'badge-vu' : 'badge-pl';
  const label = r.type.startsWith('VL') ? 'VL' : r.type.startsWith('VU') ? 'VU' : r.type.startsWith('PL') ? 'PL' : '🔧';
  return `<div class="today-rdv ${r.status}" onclick="showRdvDetail(${r.id})">
    <div class="rdv-time">${r.heure}</div>
    <div class="rdv-info">
      <div class="rdv-name">${r.nom}</div>
      <div class="rdv-detail">📍 ${r.adresse || 'Adresse non précisée'}</div>
      <div class="rdv-detail">📞 <a class="tel" href="tel:${r.tel}" onclick="event.stopPropagation()">${r.tel}</a></div>
      <span class="rdv-badge ${badge}">${label}</span>
    </div>
    <div class="rdv-actions">
      <div class="btn-icon" onclick="event.stopPropagation();callClient('${r.tel}')">📞</div>
      <div class="btn-icon" onclick="event.stopPropagation();doneRDV(${r.id})">✓</div>
    </div>
  </div>`;
}

function callClient(tel) { window.location.href = 'tel:' + tel; }
function doneRDV(id) {
  const r = rdvs.find(r => r.id === id);
  if (r) { r.status = 'done'; localStorage.setItem('clim_rdvs', JSON.stringify(rdvs)); renderAccueil(); updateStats(); showNotif('✓ RDV marqué comme fait'); }
}

// =========== STATS ===========
function updateStats() {
  const today = new Date().toISOString().split('T')[0];
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekEnd.getDate() + 6);
  const ws = weekStart.toISOString().split('T')[0];
  const we = weekEnd.toISOString().split('T')[0];
  document.getElementById('statToday').textContent = rdvs.filter(r => r.date === today && r.status !== 'annule').length;
  document.getElementById('statWeek').textContent = rdvs.filter(r => r.date >= ws && r.date <= we && r.status !== 'annule').length;
  document.getElementById('statClients').textContent = clients.length;
}

// =========== CALENDAR ===========
function renderCalendar() {
  const months = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('calMonthTitle').textContent = months[calMonth] + ' ' + calYear;
  const grid = document.getElementById('calGrid');
  const days = ['Lu','Ma','Me','Je','Ve','Sa','Di'];
  const today = new Date().toISOString().split('T')[0];
  let html = days.map(d => `<div class="cal-day-header">${d}</div>`).join('');
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  for (let i = 0; i < offset; i++) html += '<div class="cal-day empty"></div>';
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasRdv = rdvs.some(r => r.date === dateStr && r.status !== 'annule');
    const isToday = dateStr === today;
    const isSel = dateStr === selectedCalDay;
    html += `<div class="cal-day ${isToday?'today-day':''} ${hasRdv?'has-rdv':''} ${isSel&&!isToday?'selected-day':''}" onclick="selectCalDay('${dateStr}')">${d}</div>`;
  }
  grid.innerHTML = html;
  renderFullRDVList();
  if (selectedCalDay) renderDayRDVs(selectedCalDay);
}

function changeMonth(d) { calMonth += d; if (calMonth > 11) { calMonth=0; calYear++; } if (calMonth < 0) { calMonth=11; calYear--; } renderCalendar(); }

function selectCalDay(dateStr) {
  selectedCalDay = dateStr;
  renderCalendar();
  renderDayRDVs(dateStr);
}

function renderDayRDVs(dateStr) {
  const dayRdvs = rdvs.filter(r => r.date === dateStr && r.status !== 'annule').sort((a,b) => a.heure.localeCompare(b.heure));
  const div = document.getElementById('dayRDVList');
  if (dayRdvs.length === 0) { div.innerHTML = ''; return; }
  div.innerHTML = `<div class="section-title" style="font-size:18px;margin-bottom:10px;">${formatDate(dateStr)}</div>` + dayRdvs.map(r => rdvCard(r)).join('');
}

function renderFullRDVList() {
  const upcoming = rdvs.filter(r => r.status !== 'annule').sort((a,b) => a.date.localeCompare(b.date) || a.heure.localeCompare(b.heure));
  const div = document.getElementById('fullRDVList');
  if (upcoming.length === 0) { div.innerHTML = '<div class="empty-state"><div class="icon">📅</div><p>Aucun RDV enregistré</p></div>'; return; }
  // Group by date
  const byDate = {};
  upcoming.forEach(r => { if (!byDate[r.date]) byDate[r.date] = []; byDate[r.date].push(r); });
  div.innerHTML = Object.entries(byDate).map(([date, rs]) =>
    `<div class="rdv-day-header">${formatDate(date)}</div>` + rs.map(r => rdvCard(r)).join('')
  ).join('');
}

function renderRappels() {

  const today = now.toISOString().split('T')[0];
  const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate()+1);
  const tomorrowStr = tomorrow.toISOString().split('T')[0];

  const upcoming = rdvs.filter(r => r.date >= today && r.status === 'confirmed').sort((a,b) => a.date.localeCompare(b.date) || a.heure.localeCompare(b.heure));
  const div = document.getElementById('rappelList');

  if (upcoming.length === 0) {
    div.innerHTML = '<div class="empty-state"><div class="icon">🎉</div><p>Aucun RDV à venir</p></div>';
    document.getElementById('notifBadge').textContent = 'Rappels';
    return;
  }

  document.getElementById('notifBadge').innerHTML = `Rappels <span style="background:var(--red);color:#fff;padding:1px 6px;border-radius:10px;font-size:9px;margin-left:2px;">${upcoming.length}</span>`;
  setTimeout(renderBanniereNotif, 10);

  div.innerHTML = upcoming.map(r => {
    const isToday = r.date === today;
    const isTomorrow = r.date === tomorrowStr;

    return `<div class="rappel-item" onclick="showRdvDetail(${r.id})">
      <div class="rappel-dot ${dotClass}"></div>
      <div class="rappel-text">
        <div style="font-weight:700;font-size:13px;color:#fff;">${r.nom}</div>
        <div style="font-size:12px;margin-top:2px;">${r.type}</div>
        <div style="font-size:11px;color:rgba(205,232,255,0.4);">${r.adresse || 'Lieu non précisé'}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:11px;color:var(--accent);font-weight:700;">${r.heure}</div>
        <div class="rappel-time">${label}</div>
        <div style="margin-top:6px;"><a href="tel:${r.tel}" class="btn-icon" onclick="event.stopPropagation()" style="display:inline-flex;">📞</a></div>
      </div>
    </div>`;
  }).join('');
}

// Programme les notifications pour UN rdv (veille 20h, matin 7h30, 30min avant)
function programmerRappels(rdv) {
  if (notifPermission !== 'granted') return;
  if (rdv.status === 'annule') return;

  const rdvDate = new Date(rdv.date + 'T' + rdv.heure + ':00');
  const now = new Date();

  const rappels = [
    { time: new Date(rdv.date + 'T20:00:00'), label: 'veille' },
    { time: new Date(rdv.date + 'T07:30:00'), label: 'matin' },
    { time: new Date(rdvDate.getTime() - 30 * 60000), label: '30min' },
  ];

  // Veille à 20h
  const veille = new Date(rdvDate);
  veille.setDate(veille.getDate() - 1);
  veille.setHours(20, 0, 0, 0);
  planifierNotif(rdv, veille, `📅 RDV demain à ${rdv.heure} — ${rdv.nom}`, `📍 ${rdv.adresse || 'Voir l\'appli'}`);

  // Matin du RDV à 07h30
  const matin = new Date(rdv.date + 'T07:30:00');
  planifierNotif(rdv, matin, `🌅 RDV aujourd'hui à ${rdv.heure} — ${rdv.nom}`, `📍 ${rdv.adresse || rdv.type}`);

  // 30 minutes avant
  const avantRdv = new Date(rdvDate.getTime() - 30 * 60000);
  planifierNotif(rdv, avantRdv, `⏰ RDV dans 30 min — ${rdv.nom}`, `📍 ${rdv.adresse || rdv.type} · ${rdv.heure}`);
}

function planifierNotif(rdv, dateHeure, titre, corps) {
  const now = new Date();
  const delay = dateHeure.getTime() - now.getTime();
  if (delay <= 0) return; // déjà passé

  const timeoutId = setTimeout(() => {
    if (Notification.permission === 'granted') {
      const notif = new Notification(titre, {
        body: corps,
        icon: '❄️',
        tag: 'rdv-' + rdv.id + '-' + dateHeure.getTime(),
        requireInteraction: true,
      });
      notif.onclick = () => { window.focus(); notif.close(); };
    }
  }, delay);

  // Stocker l'ID pour pouvoir annuler
  const stored = JSON.parse(localStorage.getItem('clim_timeouts') || '[]');
  // On ne peut pas vraiment stocker les timeoutId entre sessions, c'est OK
}

function programmerTousRappels() {
  rdvs.forEach(r => programmerRappels(r));
}

// Vérification au lancement : notifs du jour non envoyées
function checkRappelsAuLancement() {
  if (notifPermission !== 'granted') return;
  const now = new Date();
  const today = now.toISOString().split('T')[0];
  const rdvAujourdhui = rdvs.filter(r => r.date === today && r.status === 'confirmed');

  rdvAujourdhui.forEach(r => {
    const rdvHeure = new Date(r.date + 'T' + r.heure + ':00');
    const diff = rdvHeure - now;
    // Si le RDV est dans + de 30 min, programmer le rappel 30min avant
    if (diff > 30 * 60000) {
      const avantRdv = new Date(rdvHeure.getTime() - 30 * 60000);
      planifierNotif(r, avantRdv, `⏰ RDV dans 30 min — ${r.nom}`, `📍 ${r.adresse || r.type} · ${r.heure}`);
    }
    // Si le RDV est dans - de 5 min et non fait, notification immédiate
    if (diff > -5 * 60000 && diff < 5 * 60000) {
      setTimeout(() => {
        new Notification(`🚨 RDV maintenant ! — ${r.nom}`, { body: `📍 ${r.adresse || r.type}`, requireInteraction: true });
      }, 500);
    }
  });
}

// =========== OVERRIDE saveRDV pour programmer les rappels ===========
const _origSaveRDV = saveRDV;
// On injecte programmerRappels dans saveRDV via un patch
function saveRDVWithNotif() {
  const nom = document.getElementById('rdvNom').value.trim();
  const tel = document.getElementById('rdvTel').value.trim();
  const adresse = document.getElementById('rdvAdresse').value.trim();
  const type = document.getElementById('rdvType').value;
  const date = document.getElementById('rdvDate').value;
  const heure = document.getElementById('rdvHeure').value;
  const notes = document.getElementById('rdvNotes').value.trim();
  if (!nom || !tel || !date || !heure || !type) { showNotif('⚠️ Remplis les champs requis', '#ff9500'); return; }

  const rdv = { id: Date.now(), nom, tel, adresse, type, date, heure, notes, status: 'confirmed', createdAt: new Date().toISOString() };
  rdvs.push(rdv);
  localStorage.setItem('clim_rdvs', JSON.stringify(rdvs));

  addClientIfNew(nom, tel, adresse, type);

  // PROGRAMMER LES RAPPELS
  programmerRappels(rdv);

  // Résumé rappels
  const rdvDate = new Date(date + 'T' + heure + ':00');
  const veille = new Date(rdvDate); veille.setDate(veille.getDate()-1); veille.setHours(20,0,0,0);
  const avantStr = new Date(rdvDate.getTime() - 30*60000).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});

  document.getElementById('rdvNom').value = '';
  document.getElementById('rdvTel').value = '';
  document.getElementById('rdvAdresse').value = '';
  document.getElementById('rdvType').value = '';
  document.getElementById('rdvNotes').value = '';
  document.getElementById('rdvDate').valueAsDate = new Date();
  fillHeures();

  if (notifPermission === 'granted') {
    showNotif('✓ RDV + rappels programmés !');
  } else {
    showNotif('✓ RDV enregistré !');
  }
  renderAccueil(); renderCalendar(); renderRappels(); updateStats();
  goPage('accueil', document.querySelectorAll('.nav-btn')[0]);
}

// Remplacer saveRDV par la version avec notifs
window.saveRDV = saveRDVWithNotif;
